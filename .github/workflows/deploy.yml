name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 012: "aired" is a clock, not a commit. Every build drops the cards for
  # episodes past their hubLiveAt and keeps the rest out of the bundle, so an
  # episode unlocking on Saturday needs a rebuild even when nobody pushed.
  # Monday 06:17 UTC - an odd minute, because the hour marks are congested.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.9.0
          cache: npm
      - run: npm ci
      # ubuntu-latest ships Chrome here; scripts/og.mjs screenshots the /_og
      # routes with it. Logged rather than asserted - a missing browser costs
      # the share images, not the deploy.
      - run: google-chrome --version || true
      - run: npm run build
        env:
          CHROME_PATH: /usr/bin/google-chrome
          # The site is served from the custom domain root (dungeoncrawlcast.com), so no
          # subpath; set /<repo>/ here if it ever moves back to the project URL.
          VITE_BASE: /
          # Repository variables, both optional: without SITE_URL the canonical
          # origin falls back to the registered domain, and without
          # PLAUSIBLE_DOMAIN no analytics is loaded at all.
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://dungeoncrawlcast.com' }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.PLAUSIBLE_DOMAIN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
